[package]
name = "wp-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8", features = ["macros"] }
base32 = "0.5.1"
bson = { version = "3.1", features = ["chrono-0_4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
mongodb = { version = "3.5.2", features = ["bson-3"]}
regex = "1.12.3"
rusty_paseto = "0.9.0"
serde = "1.0.228"
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-futures = "0.2.5"
tracing-panic = "0.1.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1.50.0", features=["full"] }
tower-http = { version = "0.6.8", features = ["fs", "catch-panic"] }
tower = "0.5.3"
once_cell = "1.21.4"
dotenvy = "0.15.7"
